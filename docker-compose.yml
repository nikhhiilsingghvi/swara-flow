version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - SF_LOG_LEVEL=INFO
      - SF_LLM_PROVIDER=none
      - SF_CORS_ORIGINS=http://localhost:3000
    # Camera/mic access happens in the BROWSER via getUserMedia, not
    # inside this container -- no --device passthrough needed here.

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
